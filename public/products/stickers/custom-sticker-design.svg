<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 855 1280" width="855" height="1280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFBF9" />
      <stop offset="50%" stop-color="#F5F2EB" />
      <stop offset="100%" stop-color="#EFEAE0" />
    </linearGradient>

    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FAFAF8" />
    </linearGradient>

    <!-- Teal Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Pastel Hero Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-10%" y="-5%" width="120%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1e293b" flood-opacity="0.08" />
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.04" />
    </filter>

    <filter id="pillShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f766e" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Outer Canvas Background -->
  <rect width="855" height="1280" fill="url(#bgGrad)" />

  <!-- Background Decorative Doodles & Dots -->
  <g opacity="0.35">
    <circle cx="100" cy="120" r="4" fill="#0f766e" />
    <circle cx="750" cy="140" r="5" fill="#f59e0b" />
    <circle cx="80" cy="650" r="3.5" fill="#f59e0b" />
    <circle cx="780" cy="850" r="4.5" fill="#0f766e" />
    <circle cx="120" cy="1180" r="4" fill="#f59e0b" />
    <circle cx="740" cy="1160" r="5" fill="#0f766e" />
  </g>

  <!-- Main Sticker Sheet Container (Simulates Physical Printed Sheet) -->
  <g filter="url(#cardShadow)">
    <rect x="52" y="48" width="751" height="1184" rx="36" fill="url(#sheetGrad)" stroke="#E2DCD2" stroke-width="2.5" />
  </g>

  <!-- Sheet Border Guide (Dashed Inner Printing Perimeter) -->
  <rect x="74" y="70" width="707" height="1140" rx="26" fill="none" stroke="#D1C7B7" stroke-width="1.8" stroke-dasharray="8 6" opacity="0.75" />

  <!-- Sheet Header / Brand Eyebrow -->
  <g transform="translate(427.5, 115)" text-anchor="middle">
    <!-- Daisy Flower Doodle -->
    <g transform="translate(-140, -18) scale(0.75)">
      <circle cx="20" cy="20" r="6" fill="#F59E0B" />
      <ellipse cx="20" cy="7" rx="4.5" ry="7" fill="#0D9488" />
      <ellipse cx="20" cy="33" rx="4.5" ry="7" fill="#0D9488" />
      <ellipse cx="7" cy="20" rx="7" ry="4.5" fill="#0D9488" />
      <ellipse cx="33" cy="20" rx="7" ry="4.5" fill="#0D9488" />
    </g>
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0F766E" letter-spacing="4">
      DAISY DESIGNS • CUSTOM STUDIO
    </text>
    <g transform="translate(115, -18) scale(0.75)">
      <circle cx="20" cy="20" r="6" fill="#F59E0B" />
      <ellipse cx="20" cy="7" rx="4.5" ry="7" fill="#0D9488" />
      <ellipse cx="20" cy="33" rx="4.5" ry="7" fill="#0D9488" />
      <ellipse cx="7" cy="20" rx="7" ry="4.5" fill="#0D9488" />
      <ellipse cx="33" cy="20" rx="7" ry="4.5" fill="#0D9488" />
    </g>
  </g>

  <!-- Center Hero Custom Creation Banner -->
  <g transform="translate(100, 160)">
    <rect width="655" height="340" rx="28" fill="url(#badgeGrad)" stroke="#CBD5E1" stroke-width="1.5" />
    
    <!-- Magic Sparkles & Wand Icon Group -->
    <g transform="translate(327.5, 75)">
      <circle cx="0" cy="0" r="42" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5" />
      <!-- Wand / Palette Icon -->
      <path d="M-14 14 L10 -10 M7 -13 L13 -7" stroke="#0F766E" stroke-width="3.5" stroke-linecap="round" />
      <!-- Magic Stars around -->
      <path d="M-22 -8 L-18 -8 L-18 -12 L-18 -8 L-14 -8 L-18 -8 L-18 -4 Z" fill="#F59E0B" />
      <path d="M18 10 L22 10 L22 6 L22 10 L26 10 L22 10 L22 14 Z" fill="#F59E0B" />
      <path d="M-6 -26 L-3 -26 L-3 -29 L-3 -26 L0 -26 L-3 -26 L-3 -23 Z" fill="#14B8A6" />
    </g>

    <!-- Hero Title in Arabic -->
    <text x="327.5" y="165" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#0F172A" text-anchor="middle">
      صمّم استيكرك بفكرتك ورسمتك الخاصة
    </text>

    <!-- Subtitle in Arabic -->
    <text x="327.5" y="205" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#0F766E" text-anchor="middle">
      اطلب أي شخصية كرتونية، لعبة، أو فكرة مخصصة بالكامل لطفلك
    </text>

    <!-- Features Pills Row -->
    <g transform="translate(327.5, 260)" text-anchor="middle">
      <!-- Pill 1: أي شخصية أو فكرة -->
      <g transform="translate(-180, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
        <text y="5" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#334155">🎨 شخصيتك المفضلة</text>
      </g>
      <!-- Pill 2: مع بيانات الطفل -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
        <text y="5" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#334155">✍️ باسم طفلك ومدرسته</text>
      </g>
      <!-- Pill 3: مقاوم للماء 100% -->
      <g transform="translate(180, 0)">
        <rect x="-75" y="-18" width="150" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" />
        <text y="5" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F766E">💧 مقاوم للماء 100%</text>
      </g>
    </g>
  </g>

  <!-- Big Notebook Sticker Mockup (Main Ticket) -->
  <g transform="translate(100, 530)">
    <!-- Sticker Card -->
    <rect width="655" height="360" rx="22" fill="#FFFFFF" stroke="#0F766E" stroke-width="2.5" />
    
    <!-- Cutline indicator -->
    <rect x="6" y="6" width="643" height="348" rx="18" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-dasharray="6 4" />

    <!-- Left Art Zone (Preview box for custom artwork) -->
    <g transform="translate(25, 25)">
      <rect width="210" height="310" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 4" />
      <g transform="translate(105, 130)" text-anchor="middle">
        <circle cx="0" cy="0" r="32" fill="#EEF2F6" stroke="#94A3B8" stroke-width="1.5" />
        <!-- Image icon -->
        <path d="M-12 -8 L12 -8 L12 8 L-12 8 Z" fill="none" stroke="#64748B" stroke-width="2" />
        <circle cx="-5" cy="-2" r="2.5" fill="#64748B" />
        <path d="M-10 6 L-2 -2 L4 4 L8 0 L12 6 Z" fill="#94A3B8" />
        <text y="55" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#475569">
          رسمتك أو شخصيتك
        </text>
        <text y="75" font-family="'Cairo', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94A3B8">
          (نصممها لك بجودة فائقة)
        </text>
      </g>
    </g>

    <!-- Right Personalization Data Zone (Arabic Text Mockup) -->
    <g transform="translate(260, 45)" text-anchor="end">
      <!-- Title Badge -->
      <rect x="220" y="0" width="150" height="28" rx="8" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1" />
      <text x="295" y="19" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">
        استيكر الدفاتر والكتب
      </text>

      <!-- Child Name Field Mockup -->
      <g transform="translate(370, 50)">
        <text x="0" y="0" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B">اسم الطفل:</text>
        <rect x="-370" y="8" width="370" height="46" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
        <text x="-15" y="38" font-family="'Cairo', system-ui, sans-serif" font-size="17" font-weight="900" fill="#0F172A">
          يونس محمد — Younis Mohamed
        </text>
      </g>

      <!-- School & Grade Row -->
      <g transform="translate(370, 135)">
        <!-- School -->
        <g transform="translate(0, 0)">
          <text x="0" y="0" font-family="'Cairo', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">المدرسة:</text>
          <rect x="-180" y="6" width="180" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
          <text x="-12" y="31" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">St. Joseph School</text>
        </g>
        <!-- Grade & Class -->
        <g transform="translate(-190, 0)">
          <text x="0" y="0" font-family="'Cairo', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">الصف / الفصل:</text>
          <rect x="-180" y="6" width="180" height="40" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
          <text x="-12" y="31" font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#334155">Year FS2 — 1B</text>
        </g>
      </g>

      <!-- Parent Phone Row -->
      <g transform="translate(370, 215)">
        <text x="0" y="0" font-family="'Cairo', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748B">رقم هاتف ولي الأمر:</text>
        <rect x="-370" y="6" width="370" height="38" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2" />
        <text x="-15" y="31" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#334155" dir="ltr" text-anchor="start">
          01012345678
        </text>
      </g>
    </g>
  </g>

  <!-- Thin Pencil & Water Bottle Strips (Multiple Cut Stickers) -->
  <g transform="translate(100, 920)">
    <!-- Strip 1 -->
    <g transform="translate(0, 0)">
      <rect width="655" height="52" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" />
      <circle cx="28" cy="26" r="14" fill="#F0FDFA" />
      <text x="28" y="31" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">✏️</text>
      <text x="60" y="33" font-family="'Cairo', system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A">
        يونس محمد • Younis Mohamed
      </text>
      <text x="630" y="32" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">
        ليبل رفيع للأقلام والمساطر
      </text>
    </g>

    <!-- Strip 2 -->
    <g transform="translate(0, 64)">
      <rect width="655" height="52" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" />
      <circle cx="28" cy="26" r="14" fill="#FEF3C7" />
      <text x="28" y="31" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#D97706" text-anchor="middle">⭐</text>
      <text x="60" y="33" font-family="'Cairo', system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A">
        يونس محمد • Year FS2 • 01012345678
      </text>
      <text x="630" y="32" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">
        استيكر مقاوم لزجاجات المياه
      </text>
    </g>

    <!-- Strip 3 -->
    <g transform="translate(0, 128)">
      <rect width="655" height="52" rx="14" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.8" />
      <circle cx="28" cy="26" r="14" fill="#F0FDFA" />
      <text x="28" y="31" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="800" fill="#0F766E" text-anchor="middle">🎒</text>
      <text x="60" y="33" font-family="'Cairo', system-ui, sans-serif" font-size="15" font-weight="900" fill="#0F172A">
        يونس محمد • St. Joseph School
      </text>
      <text x="630" y="32" font-family="'Cairo', system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="end">
        لانش بوكس وأدوات مدرسية
      </text>
    </g>
  </g>

  <!-- Bottom Craftsmanship Banner -->
  <g transform="translate(427.5, 1180)" text-anchor="middle">
    <text font-family="'Cairo', system-ui, sans-serif" font-size="13" font-weight="800" fill="#64748B">
      فينيل ألماني عالي التحمل • طباعة ديجيتال زاهية • مقاوم للمياه والخدش 100%
    </text>
  </g>
</svg>

